name: Bamba Daily Summary

on:
  schedule:
    - cron: '0 6 * * *'   # 9am Israel time
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Send daily summary
        env:
          ALERTZY_ACCOUNT_KEY: ${{ secrets.ALERTZY_ACCOUNT_KEY }}
          SEND_SUMMARY: "true"
        run: node bamba/bamba-monitor.js
