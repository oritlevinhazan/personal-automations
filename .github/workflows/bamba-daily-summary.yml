name: Bamba Daily Summary

on:
  schedule:
    - cron: '0 18 * * *'   # 21:00 Israel time (UTC+3)
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Count today's hourly runs
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh run list --workflow=bamba-monitor.yml --created=$(date -u +%Y-%m-%d) --json status --jq 'length')
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Send daily summary
        env:
          ALERTZY_ACCOUNT_KEY: ${{ secrets.ALERTZY_ACCOUNT_KEY }}
          SEND_SUMMARY: "true"
          DAILY_RUN_COUNT: ${{ steps.count.outputs.count }}
        run: node bamba/bamba-monitor.js
