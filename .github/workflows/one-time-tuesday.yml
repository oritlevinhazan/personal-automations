name: One-Time Tuesday Enrollment

on:
  workflow_dispatch:
    inputs:
      skip_wait:
        description: 'Skip waiting until 20:30 (for testing)'
        required: false
        default: 'false'
      dry_run:
        description: 'Dry run - check availability without enrolling'
        required: false
        default: 'false'

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run one-time Tuesday enrollment
        env:
          ARBOX_USER_EMAIL: ${{ secrets.ARBOX_USER_EMAIL }}
          ARBOX_USER_PASSWORD: ${{ secrets.ARBOX_USER_PASSWORD }}
          ALERTZY_ACCOUNT_KEY: ${{ secrets.ALERTZY_ACCOUNT_KEY }}
          SKIP_WAIT: ${{ github.event.inputs.skip_wait || 'false' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node arbox/one-time-tuesday.js
