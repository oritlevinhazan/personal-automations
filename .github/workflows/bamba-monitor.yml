name: Bamba Tour Monitor

on:
  schedule:
    - cron: '0 5 * * *'   # 08:00 Israel time
    - cron: '0 11 * * *'  # 14:00 Israel time
    - cron: '0 18 * * *'  # 21:00 Israel time
  workflow_dispatch:       # allow manual trigger for testing

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Check Bamba availability
        env:
          ALERTZY_ACCOUNT_KEY: ${{ secrets.ALERTZY_ACCOUNT_KEY }}
        run: node bamba-monitor.js
