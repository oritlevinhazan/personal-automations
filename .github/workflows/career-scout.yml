name: Career Scout Daily

on:
  schedule:
    # 7:00 AM UTC = 9:00 AM Israel (UTC+2 winter) / 10:00 AM (UTC+3 summer)
    - cron: '0 7 * * *'
  workflow_dispatch:  # manual trigger button in GitHub UI

permissions:
  contents: write  # needed to commit updated known_roles.json

jobs:
  career-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: career-scout/requirements.txt

      - name: Install Python dependencies
        working-directory: career-scout
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Career Scout
        working-directory: career-scout
        env:
          ALERTZY_KEY: ${{ secrets.ALERTZY_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python career_scout_daily.py

      - name: Commit updated known_roles.json
        run: |
          git config user.name "Career Scout Bot"
          git config user.email "career-scout-bot@users.noreply.github.com"
          git add career-scout/known_roles.json
          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes to known_roles.json — nothing to commit"
          else
            git commit -m "chore: update known_roles.json [$(date +%Y-%m-%d)]"
            git push
          fi
