name: One-Time Sunday 11:xx Enrollment

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - check availability without enrolling'
        required: false
        default: 'false'

jobs:
  enroll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run one-time Sunday 11:xx enrollment
        env:
          ARBOX_USER_EMAIL: ${{ secrets.ARBOX_USER_EMAIL }}
          ARBOX_USER_PASSWORD: ${{ secrets.ARBOX_USER_PASSWORD }}
          ALERTZY_ACCOUNT_KEY: ${{ secrets.ALERTZY_ACCOUNT_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node arbox/one-time-sunday-1100.js

      - name: Notify on crash
        if: failure()
        env:
          ALERTZY_ACCOUNT_KEY: ${{ secrets.ALERTZY_ACCOUNT_KEY }}
        run: |
          node -e "
            import('../shared/push-notification.js').then(m =>
              m.sendPushNotification(
                process.env.ALERTZY_ACCOUNT_KEY,
                '⚠️ שגיאה בסקריפט',
                'הסקריפט קרס — בדקי GitHub Actions'
              )
            )
          "
